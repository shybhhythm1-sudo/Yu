<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>لقطة | تحميل الفيديوهات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B120E;
    --bg-soft: #101A14;
    --emerald: #0E7A53;
    --emerald-bright: #17B87B;
    --gold: #D4AF37;
    --gold-soft: #E8CE7A;
    --ivory: #F3F0E6;
    --muted: #8FA396;
    --danger: #E0654F;
    --radius: 18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #12261B 0%, var(--bg) 55%);
    color: var(--ivory);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px 80px;
  }
  .wrap{ width:100%; max-width: 480px; }

  .brand{
    text-align:center;
    margin-bottom: 28px;
  }
  .brand .mark{
    font-size: 15px;
    letter-spacing: 6px;
    color: var(--gold-soft);
    font-weight:700;
  }
  .brand h1{
    font-size: 30px;
    font-weight: 900;
    margin-top: 6px;
    background: linear-gradient(90deg, var(--ivory), var(--gold-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand p{
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .input-card{
    background: var(--bg-soft);
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: var(--radius);
    padding: 14px;
    display:flex;
    gap:10px;
    align-items:center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .input-card input{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ivory);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    direction: ltr;
    text-align: right;
  }
  .input-card input::placeholder{ color: #5C6A61; }
  .icon-btn{
    width: 40px; height:40px;
    border-radius: 12px;
    border: none;
    background: rgba(212,175,55,0.12);
    color: var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .15s ease, background .15s ease;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn:hover{ background: rgba(212,175,55,0.2); }

  .fetch-btn{
    width:100%;
    margin-top: 12px;
    padding: 15px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--emerald), var(--emerald-bright));
    color: #fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease, filter .15s ease;
  }
  .fetch-btn:active{ transform: scale(0.98); }
  .fetch-btn:disabled{ filter: grayscale(0.6); opacity:0.6; cursor:not-allowed; }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---- ticket / boarding-pass style result ---- */
  .ticket{
    display:none;
    margin-top: 24px;
    background: var(--bg-soft);
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid rgba(212,175,55,0.18);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .ticket.show{ display:block; animation: rise .35s ease; }
  @keyframes rise{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:none;} }

  .ticket-media{
    position:relative;
    width:100%;
    aspect-ratio: 16/9;
    background: #060A08;
    overflow:hidden;
  }
  .ticket-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .duration-badge{
    position:absolute; bottom:8px; left:8px;
    background: rgba(0,0,0,0.65);
    color: var(--gold-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .ticket-body{ padding: 16px 18px 6px; }
  .ticket-body h2{
    font-size: 15px;
    font-weight:700;
    line-height:1.5;
    margin-bottom: 4px;
  }
  .ticket-body .uploader{
    color: var(--muted);
    font-size: 12px;
  }

  .perforation{
    position:relative;
    height: 1px;
    margin: 16px 0 0;
    border-top: 2px dashed rgba(212,175,55,0.3);
  }
  .perforation::before, .perforation::after{
    content:"";
    position:absolute; top:-9px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--bg);
  }
  .perforation::before{ right:-9px; }
  .perforation::after{ left:-9px; }

  .formats{
    padding: 16px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .format-label{
    font-size:11px;
    color: var(--muted);
    letter-spacing:2px;
    margin-bottom:4px;
  }
  .format-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .format-chip.selected{
    border-color: var(--gold);
    background: rgba(212,175,55,0.08);
  }
  .format-chip .fname{ font-size:13px; font-weight:600; }
  .format-chip .fsize{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--muted);
  }

  .download-btn{
    width:100%;
    margin-top: 8px;
    padding: 15px;
    border:none;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    color: #14210F;
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .download-btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .download-btn:active{ transform: scale(0.98); }

  /* toast */
  #toast-stack{
    position:fixed;
    bottom: 20px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    pointer-events:none;
    z-index: 999;
  }
  .toast{
    background: #1A241C;
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--ivory);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    animation: toast-in .25s ease, toast-out .25s ease 2.6s forwards;
    max-width: 85vw;
    text-align:center;
  }
  .toast.error{ border-color: rgba(224,101,79,0.5); }
  @keyframes toast-in{ from{ opacity:0; transform: translateY(10px);} to{opacity:1; transform:none;} }
  @keyframes toast-out{ to{ opacity:0; transform: translateY(10px);} }

  footer{
    text-align:center;
    margin-top: 30px;
    color: #4E5C53;
    font-size: 11px;
    line-height:1.8;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="mark">L A M H A</div>
    <h1>لقطة</h1>
    <p>الصق رابط الفيديو وهنجهزلك أفضل جودة تحمّلها</p>
  </div>

  <div class="input-card">
    <input id="urlInput" type="text" placeholder="https://..." />
    <button class="icon-btn" id="pasteBtn" title="لصق">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
    </button>
  </div>

  <button class="fetch-btn" id="fetchBtn">
    <span id="fetchBtnLabel">جلب الفيديو</span>
  </button>

  <div class="ticket" id="ticket">
    <div class="ticket-media">
      <img id="thumb" src="" alt="">
      <span class="duration-badge" id="durationBadge"></span>
    </div>
    <div class="ticket-body">
      <h2 id="videoTitle"></h2>
      <div class="uploader" id="videoUploader"></div>
    </div>
    <div class="perforation"></div>
    <div class="formats">
      <div class="format-label">اختار الجودة</div>
      <div id="formatList"></div>
      <button class="download-btn" id="downloadBtn" disabled>
        <span id="downloadBtnLabel">تحميل</span>
      </button>
    </div>
  </div>

  <footer>
    استخدم الأداة دي لمحتوى تملكه أو مسموح لك بتحميله فقط<br>
    وراعِ شروط استخدام كل منصة قبل التحميل
  </footer>
</div>

<div id="toast-stack"></div>

<script>
  // 🔧 غيّر الرابط ده لرابط سيرفر Render بتاعك بعد النشر
  const API_BASE_URL = "https://your-app.onrender.com";

  const urlInput = document.getElementById('urlInput');
  const pasteBtn = document.getElementById('pasteBtn');
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchBtnLabel = document.getElementById('fetchBtnLabel');
  const ticket = document.getElementById('ticket');
  const thumb = document.getElementById('thumb');
  const durationBadge = document.getElementById('durationBadge');
  const videoTitle = document.getElementById('videoTitle');
  const videoUploader = document.getElementById('videoUploader');
  const formatList = document.getElementById('formatList');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadBtnLabel = document.getElementById('downloadBtnLabel');

  let selectedFormat = null;
  let currentUrl = null;

  function showToast(message, isError = false){
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function formatDuration(seconds){
    if(!seconds) return '';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }

  pasteBtn.addEventListener('click', async () => {
    try{
      const text = await navigator.clipboard.readText();
      urlInput.value = text;
      showToast('تم اللصق');
    }catch(e){
      showToast('مقدرش أوصل للحافظة، الصق يدوياً', true);
    }
  });

  fetchBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if(!url){
      showToast('حط رابط الفيديو الأول', true);
      return;
    }

    fetchBtn.disabled = true;
    fetchBtnLabel.innerHTML = '<span class="spinner"></span>';
    ticket.classList.remove('show');

    try{
      const res = await fetch(`${API_BASE_URL}/api/info`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
      });
      const data = await res.json();

      if(!res.ok){
        showToast(data.error || 'حصل خطأ، جرب تاني', true);
        return;
      }

      currentUrl = url;
      thumb.src = data.thumbnail || '';
      durationBadge.textContent = formatDuration(data.duration);
      videoTitle.textContent = data.title || 'بدون عنوان';
      videoUploader.textContent = data.uploader || '';

      formatList.innerHTML = '';
      selectedFormat = null;
      downloadBtn.disabled = true;

      (data.formats || []).forEach((f, idx) => {
        const chip = document.createElement('div');
        chip.className = 'format-chip';
        chip.innerHTML = `
          <span class="fname">${f.label}</span>
          <span class="fsize">${f.size_mb ? f.size_mb + ' MB' : '—'}</span>
        `;
        chip.addEventListener('click', () => {
          document.querySelectorAll('.format-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          selectedFormat = f.format_id;
          downloadBtn.disabled = false;
        });
        formatList.appendChild(chip);
        if(idx === 0){ chip.click(); }
      });

      ticket.classList.add('show');
    }catch(e){
      showToast('مقدرش أوصل للسيرفر، تأكد إنه شغال', true);
    }finally{
      fetchBtn.disabled = false;
      fetchBtnLabel.textContent = 'جلب الفيديو';
    }
  });

  downloadBtn.addEventListener('click', async () => {
    if(!currentUrl || !selectedFormat) return;

    downloadBtn.disabled = true;
    downloadBtnLabel.innerHTML = '<span class="spinner"></span>';

    try{
      const res = await fetch(`${API_BASE_URL}/api/download`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: currentUrl, format_id: selectedFormat})
      });

      if(!res.ok){
        const data = await res.json().catch(() => ({}));
        showToast(data.error || 'فشل التحميل', true);
        return;
      }

      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="?(.+?)"?$/);
      const filename = match ? match[1] : 'video.mp4';

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();

      showToast('تم التحميل بنجاح ✅');
    }catch(e){
      showToast('حصل خطأ أثناء التحميل', true);
    }finally{
      downloadBtn.disabled = false;
      downloadBtnLabel.textContent = 'تحميل';
    }
  });

  urlInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') fetchBtn.click();
  });
</script>

</body>
</html>
